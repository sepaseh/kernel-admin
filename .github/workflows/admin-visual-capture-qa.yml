name: Pending application visual captures (QA exception)
on:
  push:
    branches:
      - codex/admin-visual-qa-20261029
permissions:
  contents: read
  actions: read
concurrency:
  group: admin-visual-capture-qa
  cancel-in-progress: false
jobs:
  pending-captures:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      CI: "true"
      KERNEL_SYNTHETIC_ENV: "1"
      STORYBOOK_DISABLE_TELEMETRY: "1"
      VITE_API_BASE_URL: https://api.example.com
      VITE_APP_BASE_URL: /
      VITE_OBSERVABILITY_URL: ""
      VITE_RELEASE_ID: visual-fixture
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          architecture: x64
      - name: Verify two-commit transport and export exact raw product tree
        id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .qa/admin-visual-capture/capture.mjs prepare
      - name: Read the exact prior capture artifact after separate human image approval
        if: steps.prepare.outputs.mode == 'verify'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ steps.prepare.outputs.capture_artifact_id }}
          run-id: ${{ steps.prepare.outputs.capture_run_id }}
          github-token: ${{ github.token }}
          repository: sepaseh/kernel-admin
          path: coverage/qa-visual/captured
          merge-multiple: true
          digest-mismatch: error
      - name: Install locked dependencies in the separate product export
        working-directory: coverage/qa-transport/product
        run: npm ci
      - name: Install the canonical locked browser dependencies
        working-directory: coverage/qa-transport/product
        run: npm run browser:install
      - name: Capture pending images or execute the complete approved-tree gate
        run: node .qa/admin-visual-capture/capture.mjs execute
      - name: Preserve pending evidence, including failed or partial captures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: admin-visual-pending-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage/qa-visual/
          if-no-files-found: error
          retention-days: 14
          overwrite: false
          include-hidden-files: false
      - name: Preserve canonical verification coverage and browser reports
        if: always() && steps.prepare.outputs.mode == 'verify'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: admin-application-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage/qa-transport/product/coverage/
          if-no-files-found: error
          retention-days: 14
          overwrite: false
          include-hidden-files: false
