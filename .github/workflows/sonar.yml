name: SonarQube Cloud
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  analysis:
    name: SonarQube Cloud analysis
    if: github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - name: Require configured SonarQube Cloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: node --input-type=module -e 'if (!process.env.SONAR_TOKEN ||
          !process.env.SONAR_PROJECT_KEY) { console.error("Configure SONAR_TOKEN
          and SONAR_PROJECT_KEY before analysis. No Sonar analysis was
          performed."); process.exit(1); }'
      - name: Verify the exact declared publication snapshot
        run: node scripts/validate-bootstrap.mjs
      - run: npm ci
      - run: npm run browser:install
      - name: Validate the complete published scope and measured coverage
        run: npm run validate -- full
      - name: Analyze published source and measured coverage
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
      - name: Preserve failed application verification reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sonar-analysis-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            coverage/e2e/
            coverage/visual/
            coverage/lighthouse/
          if-no-files-found: warn
          retention-days: 3
          overwrite: false
          include-hidden-files: false
env:
  KERNEL_SYNTHETIC_ENV: "1"
  STORYBOOK_DISABLE_TELEMETRY: "1"
  VITE_API_BASE_URL: https://api.example.com
  VITE_APP_BASE_URL: /
  VITE_OBSERVABILITY_URL: ""
  VITE_RELEASE_ID: application-verification
