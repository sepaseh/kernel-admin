name: CI
on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - ready_for_review
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  check:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Enforce the 100-file pull request limit
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-pr-size.mjs
      - run: npm ci
      - run: npm run browser:install
      - run: npm run validate -- full
      - name: Preserve failed application verification reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ci-check-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            coverage/e2e/
            coverage/visual/
            coverage/lighthouse/
          if-no-files-found: warn
          retention-days: 3
          overwrite: false
          include-hidden-files: false
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:bundle
  e2e:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run browser:install
      - run: npm run test:e2e
      - name: Preserve failed browser journey reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ci-e2e-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage/e2e/
          if-no-files-found: warn
          retention-days: 3
          overwrite: false
          include-hidden-files: false
  visual:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run browser:install
      - run: npm run test:visual
      - name: Preserve failed visual comparison reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ci-visual-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage/visual/
          if-no-files-found: warn
          retention-days: 3
          overwrite: false
          include-hidden-files: false
env:
  KERNEL_SYNTHETIC_ENV: "1"
  STORYBOOK_DISABLE_TELEMETRY: "1"
  VITE_API_BASE_URL: https://api.example.com
  VITE_APP_BASE_URL: /
  VITE_OBSERVABILITY_URL: ""
  VITE_RELEASE_ID: application-verification
