name: CI
on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - ready_for_review
  schedule:
    - cron: 30 1 * * *
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
env:
  KERNEL_SYNTHETIC_ENV: "1"
jobs:
  quality:
    name: Static checks
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked validation dependencies
        run: npm ci --strict-peer-deps --no-audit --no-fund
      - name: Install Chromium for Storybook verification
        run: npm run browser:install
      - name: Static checks
        run: npm run validate -- ci-quality
  audit:
    name: Dependency audit
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Dependency audit
        run: npm run validate -- ci-audit
  unit:
    name: Unit tests
    runs-on: windows-2025
    timeout-minutes: 15
    outputs:
      artifact: ${{ steps.evidence.outputs.artifact }}
      attempt: ${{ steps.evidence.outputs.attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked validation dependencies
        run: npm ci --strict-peer-deps --no-audit --no-fund
      - name: Unit tests
        run: npm run validate -- ci-unit
      - name: Bind measured suite coverage to this source and attempt
        id: evidence
        env:
          CI_EVIDENCE_SUITE: unit
        run: node scripts/ci-evidence.mjs --record
      - name: Share measured suite coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ steps.evidence.outputs.artifact }}
          path: |
            coverage/unit/lcov.info
            coverage/unit/ci-evidence.json
          if-no-files-found: error
          retention-days: 3
          overwrite: false
          include-hidden-files: false
  governance:
    name: Governance tests
    runs-on: windows-2025
    timeout-minutes: 30
    outputs:
      artifact: ${{ steps.evidence.outputs.artifact }}
      attempt: ${{ steps.evidence.outputs.attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked validation dependencies
        run: npm ci --strict-peer-deps --no-audit --no-fund
      - name: Governance tests
        run: npm run validate -- ci-governance
      - name: Bind measured suite coverage to this source and attempt
        id: evidence
        env:
          CI_EVIDENCE_SUITE: governance
        run: node scripts/ci-evidence.mjs --record
      - name: Share measured suite coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ steps.evidence.outputs.artifact }}
          path: |
            coverage/governance/lcov.info
            coverage/governance/ci-evidence.json
          if-no-files-found: error
          retention-days: 3
          overwrite: false
          include-hidden-files: false
  check:
    needs:
      - quality
      - audit
      - unit
      - governance
    if: always()
    runs-on: windows-2025
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every validation job to succeed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node -e "const needs = JSON.parse(process.env.CI_NEEDS); const required = ['quality', 'audit', 'unit', 'governance']; if (required.some(id => needs[id]?.result !== 'success')) process.exit(1);"
  analysis:
    name: SonarQube Cloud analysis
    needs:
      - check
      - unit
      - governance
    if: needs.check.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Require configured SonarQube Cloud analysis
        env:
          SONAR_TOKEN_CONFIGURED: ${{ secrets.SONAR_TOKEN != '' }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: if ($env:SONAR_TOKEN_CONFIGURED -ne "true" -or [string]::IsNullOrWhiteSpace($env:SONAR_PROJECT_KEY)) { throw "Configure SONAR_TOKEN and SONAR_PROJECT_KEY before analysis. No Sonar analysis was performed." }
      - name: Download measured unit coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ needs.unit.outputs.artifact }}
          path: coverage/unit
          digest-mismatch: error
      - name: Verify unit coverage provenance and contents
        env:
          CI_EVIDENCE_SUITE: unit
          CI_EVIDENCE_PRODUCER_ATTEMPT: ${{ needs.unit.outputs.attempt }}
        run: node scripts/ci-evidence.mjs --verify-coverage
      - name: Download measured governance coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ needs.governance.outputs.artifact }}
          path: coverage/governance
          digest-mismatch: error
      - name: Verify governance coverage provenance and contents
        env:
          CI_EVIDENCE_SUITE: governance
          CI_EVIDENCE_PRODUCER_ATTEMPT: ${{ needs.governance.outputs.attempt }}
        run: node scripts/ci-evidence.mjs --verify-coverage
      - name: Install analysis dependencies without package scripts
        run: npm ci --strict-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Analyze the tested source and measured coverage
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }} -Dsonar.scm.revision=${{ github.event.pull_request.head.sha || github.sha }}
