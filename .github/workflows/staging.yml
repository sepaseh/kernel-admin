name: Staging validation

on:
  workflow_dispatch:
    inputs:
      application_url:
        description: Staging application base URL
        required: true
        type: string
      api_health_url:
        description: Staging API health endpoint
        required: true
        type: string

concurrency:
  cancel-in-progress: true
  group: staging-${{ inputs.application_url }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      STAGING_ALLOWED_API_HOST: ${{ vars.STAGING_ALLOWED_API_HOST }}
      STAGING_ALLOWED_APP_HOST: ${{ vars.STAGING_ALLOWED_APP_HOST }}
      STAGING_API_HEALTH_URL: ${{ inputs.api_health_url }}
      STAGING_BASE_URL: ${{ inputs.application_url }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: npm
          node-version-file: .nvmrc

      - name: Validate staging targets
        run: node scripts/validate-workflow-targets.mjs staging

      - run: npm ci --strict-peer-deps --no-audit --no-fund

      - run: npx playwright install --with-deps chromium firefox webkit

      - run: npm run test:staging

      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: staging-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            coverage/staging/report
            coverage/staging/results
          retention-days: 14
          if-no-files-found: warn
          overwrite: false
          include-hidden-files: false
