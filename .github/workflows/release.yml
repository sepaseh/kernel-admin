name: Release

on:
  workflow_dispatch:

permissions: {}

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Require release token
        env:
          RELEASE_TOKEN_CONFIGURED: ${{ secrets.RELEASE_PLEASE_TOKEN != '' }}
        run: |
          if [ "$RELEASE_TOKEN_CONFIGURED" != "true" ]; then
            echo "::error::Configure RELEASE_PLEASE_TOKEN before running Release Please."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Require admitted application and changelog
        run: |
          if ! jq -e '(.applicationReady == true) and (.allowedFiles | index("CHANGELOG.md") != null)' .github/bootstrap-policy.json >/dev/null || [ ! -f CHANGELOG.md ]; then
            echo "::error::Release Please requires an admitted application and CHANGELOG.md."
            exit 1
          fi

      - name: Create or update release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
