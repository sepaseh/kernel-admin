# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
reviews:
  auto_approvals:
    allow_author_approval: false
    enabled: true
  auto_review:
    auto_incremental_review: false
    auto_pause_after_reviewed_commits: 0
    base_branches:
      - "^codex/.*$"
    drafts: false
    enabled: false
  high_level_summary: true
  poem: false
  profile: chill
  review_status: true
  path_instructions:
    - path: "**/*"
      instructions: >-
        Report concrete technical defects. Numerical metrics, formatting and
        import-order scores are advisory; do not request source rewrites, generic
        abstractions or shallow tests merely to improve them. Preserve assertions,
        type safety and security controls. When source is protected, record the
        trigger, evidence and minimal proposal for discussion before a source edit.
