services:
  admin:
    image: kernel-admin:${VITE_RELEASE_ID:?Immutable release required}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?Public API origin required}
        VITE_APP_BASE_URL: ${VITE_APP_BASE_URL:-/}
        VITE_RELEASE_ID: ${VITE_RELEASE_ID:?Immutable release required}
        ADMIN_HOST: ${ADMIN_HOST:?Public admin hostname required}
        PUBLIC_ASSET_ORIGIN: ${PUBLIC_ASSET_ORIGIN:-}
        VITE_OBSERVABILITY_URL: ${VITE_OBSERVABILITY_URL:-}
        HTTPS_PORT: ${HTTPS_PORT:-443}
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:8080"
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:8443"
    volumes:
      - type: bind
        source: ${TLS_CERT_DIRECTORY:?Set existing absolute TLS certificate directory}
        target: /etc/kernel-admin/tls
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped
    stop_grace_period: 15s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
