sonar.organization=sepaseh
sonar.sources=src,scripts,.agents/hooks,tooling
sonar.tests=src,scripts
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,src/test/**,scripts/*.test.mjs,scripts/*.test.ps1,scripts/*.test-support.mjs,src/**/*.stories.tsx
sonar.exclusions=src/**/*.test.ts,src/**/*.test.tsx,src/test/**,scripts/*.test.mjs,scripts/*.test.ps1,scripts/*.test-support.mjs,src/**/*.stories.tsx
sonar.cpd.exclusions=src/shared/i18n/locales/*.ts
sonar.javascript.lcov.reportPaths=coverage/unit/lcov.info,coverage/governance/lcov.info
sonar.qualitygate.wait=false
