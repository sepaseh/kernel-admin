sonar.organization=sepaseh
sonar.sources=scripts,.agents/hooks,deploy,tooling
sonar.tests=scripts
# Test fixtures remain analyzed; source exclusions prevent indexing the same files twice.
sonar.test.inclusions=scripts/*.test.mjs,scripts/*.test.ps1,scripts/*.test-support.mjs
sonar.exclusions=scripts/*.test.mjs,scripts/*.test.ps1,scripts/*.test-support.mjs
# Duplication measurement is disabled; retain source, security and coverage analysis.
sonar.cpd.exclusions=**/*
sonar.javascript.lcov.reportPaths=coverage/unit/lcov.info,coverage/governance/lcov.info
sonar.qualitygate.wait=false
