sonar.organization=sepaseh
sonar.sources=src,scripts,.storybook,.agents/hooks,deploy,tooling,vite.config.ts,playwright.config.ts,playwright.visual.config.ts,vitest.contract.config.ts
sonar.tests=src,scripts,.storybook,e2e,contract
# Test fixtures remain analyzed; source exclusions prevent indexing the same files twice.
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,src/test/**,scripts/*.test.mjs,src/**/*.stories.tsx,.storybook/**,e2e/**,contract/**
sonar.exclusions=src/**/*.test.ts,src/**/*.test.tsx,src/test/**,scripts/*.test.mjs,src/**/*.stories.tsx,.storybook/**,e2e/**,contract/**
# Static language records repeat their required key schema; retain source, security and coverage analysis.
sonar.cpd.exclusions=src/shared/i18n/locales/*.ts
sonar.javascript.lcov.reportPaths=coverage/unit/lcov.info,coverage/governance/lcov.info
sonar.qualitygate.wait=false
